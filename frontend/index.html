<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="创界管理系统 基于 vue3 + CompositionAPI + typescript + vite3 + element plus 的后台开源免费管理系统！"
    />
    <meta
      name="description"
      content="创界管理系统 基于 vue3 + CompositionAPI + typescript + vite3 + element plus 的后台开源免费管理系统！"
    />
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="app">
      <style>
        .app-loading {
          position: relative;
          display: flex;
          width: 100%;
          height: 100%;
          min-height: 100vh;
          overflow: hidden;
          justify-content: center;
          align-items: center;
          background: linear-gradient(145deg, #eef2ff 0%, #f5f3ff 38%, #e0f2fe 72%, #f8fafc 100%);
        }

        .app-loading::before,
        .app-loading::after {
          position: absolute;
          border-radius: 50%;
          filter: blur(40px);
          content: '';
          pointer-events: none;
        }

        .app-loading::before {
          top: -12%;
          left: -8%;
          width: 42vw;
          height: 42vw;
          background: rgba(124, 92, 255, 0.28);
          animation: loading-orb-a 6s ease-in-out infinite;
        }

        .app-loading::after {
          right: -10%;
          bottom: -14%;
          width: 38vw;
          height: 38vw;
          background: rgba(56, 189, 248, 0.24);
          animation: loading-orb-b 7s ease-in-out infinite;
        }

        .app-loading .app-loading-wrap {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 36px 44px 32px;
          background: rgba(255, 255, 255, 0.55);
          border: 1px solid rgba(255, 255, 255, 0.7);
          border-radius: 24px;
          box-shadow:
            0 20px 50px rgba(76, 29, 149, 0.12),
            inset 0 1px 0 rgba(255, 255, 255, 0.8);
          backdrop-filter: blur(18px);
          -webkit-backdrop-filter: blur(18px);
        }

        .app-loading .app-loading-title {
          margin: 0 0 28px;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.02em;
          color: #312e81;
          text-align: center;
        }

        .app-loading .app-loading-logo {
          display: block;
          width: 72px;
          margin: 0 auto 14px;
          border-radius: 18px;
          box-shadow: 0 10px 24px rgba(109, 94, 252, 0.28);
        }

        .app-loading .app-loading-spinner {
          position: relative;
          width: 64px;
          height: 64px;
        }

        .app-loading .app-loading-ring {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          background: conic-gradient(
            from 0deg,
            rgba(124, 92, 255, 0) 0%,
            #7c5cff 35%,
            #4f7cff 55%,
            #38bdf8 75%,
            rgba(56, 189, 248, 0) 100%
          );
          -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
          mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
          animation: loading-spin 1.1s linear infinite;
        }

        .app-loading .app-loading-core {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 14px;
          height: 14px;
          margin: -7px 0 0 -7px;
          background: linear-gradient(135deg, #7c5cff, #38bdf8);
          border-radius: 50%;
          box-shadow: 0 0 0 0 rgba(124, 92, 255, 0.45);
          animation: loading-pulse 1.4s ease-out infinite;
        }

        .app-loading .app-loading-dots {
          display: flex;
          gap: 8px;
          margin-top: 22px;
        }

        .app-loading .app-loading-dots span {
          width: 7px;
          height: 7px;
          background: linear-gradient(135deg, #7c5cff, #4f7cff);
          border-radius: 50%;
          opacity: 0.35;
          animation: loading-dot 1.2s ease-in-out infinite;
        }

        .app-loading .app-loading-dots span:nth-child(2) {
          animation-delay: 0.15s;
          background: linear-gradient(135deg, #4f7cff, #38bdf8);
        }

        .app-loading .app-loading-dots span:nth-child(3) {
          animation-delay: 0.3s;
          background: linear-gradient(135deg, #38bdf8, #7c5cff);
        }

        .app-loading .app-loading-hint {
          margin-top: 14px;
          font-size: 12px;
          color: rgba(49, 46, 129, 0.55);
          letter-spacing: 0.08em;
        }

        @keyframes loading-spin {
          to {
            transform: rotate(360deg);
          }
        }

        @keyframes loading-pulse {
          0% {
            transform: scale(0.85);
            box-shadow: 0 0 0 0 rgba(124, 92, 255, 0.45);
          }

          70% {
            transform: scale(1);
            box-shadow: 0 0 0 12px rgba(124, 92, 255, 0);
          }

          100% {
            transform: scale(0.85);
            box-shadow: 0 0 0 0 rgba(124, 92, 255, 0);
          }
        }

        @keyframes loading-dot {
          0%,
          80%,
          100% {
            opacity: 0.3;
            transform: translateY(0);
          }

          40% {
            opacity: 1;
            transform: translateY(-4px);
          }
        }

        @keyframes loading-orb-a {
          0%,
          100% {
            transform: translate(0, 0);
          }

          50% {
            transform: translate(4vw, 3vh);
          }
        }

        @keyframes loading-orb-b {
          0%,
          100% {
            transform: translate(0, 0);
          }

          50% {
            transform: translate(-3vw, -4vh);
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .app-loading .app-loading-ring,
          .app-loading .app-loading-core,
          .app-loading .app-loading-dots span,
          .app-loading::before,
          .app-loading::after {
            animation: none;
          }
        }
      </style>
      <div class="app-loading">
        <div class="app-loading-wrap">
          <div class="app-loading-title">
            <img src="/logo.png" class="app-loading-logo" alt="Logo" />
            <div>%VITE_APP_TITLE%</div>
          </div>
          <div class="app-loading-spinner" aria-hidden="true">
            <div class="app-loading-ring"></div>
            <div class="app-loading-core"></div>
          </div>
          <div class="app-loading-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="app-loading-hint">LOADING</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
